services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: daily-tracker-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATA_DIR: /data
      UPLOAD_DIR: /data/uploads
      VISION_MODEL: ${VISION_MODEL:-gemini-2.5-flash}
      VISION_PROVIDER: ${VISION_PROVIDER:-gemini}
    volumes:
      - tracker_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: daily-tracker-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  tracker_data:
